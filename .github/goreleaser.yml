# test this file with
#   goreleaser release --config .github/goreleaser.yml --clean --snapshot
version: 2
builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      # goreleaser passes each list item to go build as ONE argv element, so
      # the tag must use the -tags=value form instead of a split "-tags value"
      - -tags=webssh
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
      - openbsd
    goarch:
      - 386
      - amd64
      - arm
      - arm64
      - ppc64
      - ppc64le
      - mips
      - mipsle
      - mips64
      - mips64le
      - s390x
    goarm:
      - '6'
      - '7'
nfpms:
  - maintainer: "https://github.com/{{ .Env.GITHUB_USER }}"
    formats:
      - deb
      - rpm
      - apk
archives:
  - formats:
      - gz
    files:
      - none*
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
